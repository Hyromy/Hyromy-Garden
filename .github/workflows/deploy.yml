name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build and push Docker image"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag Image (YY.MM.DD or latest)'
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determinar Tag de la imagen
        run: |
          if [ "${{ github.event_name }}" == 'workflow_dispatch' ]; then
            echo "TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV
            echo "Deploying rollback from: ${{ inputs.image_tag }}"
          else
            echo "TAG=latest" >> $GITHUB_ENV
            echo "Deploying latest image"
          fi

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            docker pull ${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:${{ env.TAG }}

            docker stop ${{ vars.CONTAINER_NAME }} || true
            docker rm ${{ vars.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ vars.CONTAINER_NAME }} \
              -p ${{ vars.VPS_PORT }}:3000 \
              ${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:${{ env.TAG }}

            docker image prune -f
